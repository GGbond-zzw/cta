[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "china-cta"
version = "0.2.0"
description = "RQSDK-based domestic futures CTA research framework"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.3.3",
  "scipy==1.10.1",
  "matplotlib==3.11.1",
  "pyarrow==23.0.1",
  "PyYAML==6.0.3",
  "rqdatac==3.6.3",
  "rqsdk==1.7.4",
]

[project.optional-dependencies]
research = ["jupyter==1.1.1"]
test = ["pytest==9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires configured RQData credentials and network access",
  "formal: runs an RQAlpha Plus formal-backtest check",
]

[tool.setuptools.packages.find]
include = ["china_cta*"]
